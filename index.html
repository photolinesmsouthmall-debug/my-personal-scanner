<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Scanner - GitHub CSV Storage</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
        #video-container { position: relative; display: inline-block; width: 100%; max-width: 400px; margin-top: 10px; }
        video { width: 100%; border-radius: 12px; border: 3px solid #333; background: #000; }
        #overlay { position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 2px dashed #00ffcc; pointer-events: none; }
        #status { font-size: 16px; font-weight: bold; margin-top: 15px; color: #00ffcc; }
        .btn { padding: 12px 24px; font-size: 16px; background-color: #00ffcc; color: #121212; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .config-box { background: #1e1e1e; padding: 15px; border-radius: 8px; max-width: 400px; margin: 10px auto; text-align: left; }
        .config-box input { width: 93%; padding: 8px; margin: 5px 0 10px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
        #log-table { width: 100%; max-width: 500px; margin: 20px auto; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        #log-table th, #log-table td { padding: 10px; border-bottom: 1px solid #333; text-align: left; font-size: 14px; }
        #log-table th { background: #2a2a2a; color: #00ffcc; }
    </style>
</head>
<body>

    <h2>Receipt Scanner</h2>

    <!-- GitHub Storage Config -->
    <div class="config-box">
        <label>GitHub Username:</label>
        <input type="text" id="gh-owner" placeholder="e.g. jondoe">
        
        <label>Repository Name:</label>
        <input type="text" id="gh-repo" placeholder="receipt-scanner">
        
        <label>Personal Access Token (PAT):</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
        
        <button class="btn" style="width:100%; padding:8px;" onclick="saveConfig()">Save Settings</button>
    </div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="overlay"></div>
    </div>

    <br>
    <button id="cam-btn" class="btn" onclick="startCamera()">Start Camera</button>

    <div id="status">Save settings above or start camera.</div>

    <table id="log-table">
        <thead>
            <tr>
                <th>Receipt #</th>
                <th>Customer</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="log-body"></tbody>
    </table>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const camBtn = document.getElementById('cam-btn');
        const logBody = document.getElementById('log-body');

        let isProcessing = false;
        let worker = null;
        let scannedReceipts = new Set();
        let scannedDataList = [];

        // Load credentials from LocalStorage
        document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
        document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';

        function saveConfig() {
            localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
            alert('GitHub credentials saved locally!');
        }

        async function initOCR() {
            statusText.innerText = "Loading OCR Engine...";
            worker = await Tesseract.createWorker('eng');
            statusText.innerText = "Ready! Click 'Start Camera'.";
        }
        initOCR();

        async function startCamera() {
            if (!worker) return alert("OCR engine is still loading.");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                handleStream(stream);
            } catch (err) {
                try {
                    const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                    handleStream(fallback);
                } catch (e) {
                    statusText.innerText = "Camera access denied.";
                }
            }
        }

        function handleStream(stream) {
            video.srcObject = stream;
            camBtn.style.display = "none";
            statusText.innerText = "Scanning... Point camera at receipt";
            setInterval(scanFrame, 1000);
        }

        async function scanFrame() {
            if (isProcessing || !video.videoWidth) return;
            isProcessing = true;

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const { data: { text } } = await worker.recognize(canvas);
            parseText(text);
            isProcessing = false;
        }

        function parseText(text) {
            // 1. RECEIPT NUMBER (Pads leading zeros to match 10-digit standard e.g. #0000110968)
            let receiptNo = null;
            const matchDigits = text.match(/#?\s*0*(\d{5,7})/);
            if (matchDigits && matchDigits[1]) {
                receiptNo = "#" + matchDigits[1].padStart(10, '0');
            }

            if (receiptNo) {
                if (scannedReceipts.has(receiptNo)) {
                    statusText.innerText = `Skipped Duplicate: ${receiptNo}`;
                    return;
                }

                // 2. CUSTOMER NAME (Fixes truncated short names like MIN/HIN/NIN)
                let customerName = "UNKNOWN";
                let cleanedText = text.replace(/S[NH1lI][#H:]?/gi, 'SN#:');
                
                const snMatch = cleanedText.match(/SN#:\s*[A-Z0-9]*\s*[-:\s]+\s*([A-Za-z\s]{3,30})/i);
                if (snMatch && snMatch[1]) {
                    let extracted = snMatch[1].replace(/[^A-Za-z\s]/g, '').trim();
                    if (!/TOTAL|SUB|CASH|PRICE|AMOUNT|CHANGE|VAT/i.test(extracted) && extracted.length >= 3) {
                        customerName = extracted;
                    }
                }

                if (customerName === "UNKNOWN") {
                    const lines = text.split('\n');
                    for (let line of lines) {
                        if (/SN/i.test(line)) {
                            let parts = line.split(/[-:]/);
                            if (parts.length > 1) {
                                let candidate = parts[parts.length - 1].replace(/[^A-Za-z\s]/g, '').trim();
                                if (candidate.length >= 3 && !/TOTAL|SUB|CASH|PRICE|AMOUNT/i.test(candidate)) {
                                    customerName = candidate;
                                    break;
                                }
                            }
                        }
                    }
                }

                // 3. AMOUNT FIX (Preserves decimals or restores missing decimal points)
                let amount = 0.00;
                const subTotalMatch = text.match(/SUB-?\s*TOTAL\s*[:=]?\s*([\d,]+\.\d{2})/i);
                if (subTotalMatch && subTotalMatch[1]) {
                    amount = parseFloat(subTotalMatch[1].replace(',', ''));
                } else {
                    const decimalAmounts = text.match(/\b\d+[\.,]\d{2}\b/g);
                    if (decimalAmounts && decimalAmounts.length > 0) {
                        let lastVal = decimalAmounts[decimalAmounts.length - 1].replace(',', '.');
                        amount = parseFloat(lastVal);
                    } else {
                        const rawNumbers = text.match(/\b\d{3,6}\b/g);
                        if (rawNumbers && rawNumbers.length > 0) {
                            let rawStr = rawNumbers[rawNumbers.length - 1];
                            if (rawStr.length >= 3) {
                                let formatted = rawStr.slice(0, -2) + "." + rawStr.slice(-2);
                                amount = parseFloat(formatted);
                            }
                        }
                    }
                }

                scannedReceipts.add(receiptNo);
                
                const record = {
                    timestamp: new Date().toLocaleString(),
                    receiptNo: receiptNo,
                    customerName: customerName,
                    amount: amount
                };

                scannedDataList.push(record);
                logData(receiptNo, customerName, amount);
                
                statusText.innerText = `Scanned ${receiptNo}! Saving to GitHub...`;
                statusText.style.color = "#00ffcc";

                saveToGitHubCSV(scannedDataList);
            }
        }

        function logData(receiptNo, name, amount) {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${receiptNo}</td><td>${name}</td><td>₱${amount.toFixed(2)}</td>`;
            logBody.prepend(row);
        }

        // --- GITHUB CSV STORAGE INTEGRATION ---
        async function saveToGitHubCSV(dataList) {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!owner || !repo || !token) {
                statusText.innerText = "Saved locally. Add GitHub token to sync to repo!";
                statusText.style.color = "#ffcc00";
                return;
            }

            let csvContent = "Timestamp,Receipt No,Customer Name,Amount\n";
            dataList.forEach(row => {
                csvContent += `"${row.timestamp}","${row.receiptNo}","${row.customerName}","${row.amount}"\n`;
            });

            const path = 'scanned_receipts.csv';
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const encodedContent = btoa(unescape(encodeURIComponent(csvContent)));

            try {
                let sha = null;
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update scanned receipts CSV [${new Date().toLocaleTimeString()}]`,
                        content: encodedContent,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    statusText.innerText = `Saved ${dataList[dataList.length - 1].receiptNo} to scanned_receipts.csv in GitHub!`;
                    statusText.style.color = "#00ff00";
                } else {
                    statusText.innerText = "GitHub save failed. Check token permissions.";
                    statusText.style.color = "#ff3333";
                }
            } catch (err) {
                console.error("GitHub CSV sync failed:", err);
                statusText.innerText = "Network error while saving to GitHub.";
            }
        }
    </script>
</body>
</html>
