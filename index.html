<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Receipt Scanner</title>
    <!-- Load Tesseract.js directly from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
        #video-container { position: relative; display: inline-block; width: 100%; max-width: 400px; margin-top: 10px; }
        video { width: 100%; border-radius: 12px; border: 3px solid #333; background: #000; }
        #overlay { position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 2px dashed #00ffcc; pointer-events: none; }
        #status { font-size: 18px; font-weight: bold; margin-top: 15px; color: #00ffcc; }
        .btn { padding: 12px 24px; font-size: 16px; background-color: #00ffcc; color: #121212; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #log-table { width: 100%; max-width: 500px; margin: 20px auto; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        #log-table th, #log-table td { padding: 10px; border-bottom: 1px solid #333; text-align: left; font-size: 14px; }
        #log-table th { background: #2a2a2a; color: #00ffcc; }
    </style>
</head>
<body>

    <h2>Offline Receipt Scanner</h2>
    <p>Runs entirely in your browser with zero server delay.</p>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="overlay"></div>
    </div>

    <br>
    <button id="cam-btn" class="btn" onclick="startCamera()">Start Camera</button>

    <div id="status">Click "Start Camera" to begin.</div>

    <!-- Scanned Receipts Output -->
    <table id="log-table">
        <thead>
            <tr>
                <th>Receipt #</th>
                <th>Customer</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="log-body">
            <!-- Scanned records populate here -->
        </tbody>
    </table>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const camBtn = document.getElementById('cam-btn');
        const logBody = document.getElementById('log-body');

        let isProcessing = false;
        let worker = null;
        let scannedReceipts = new Set();
        let customerBalances = {};

        // 1. Initialize Tesseract.js Worker
        async function initOCR() {
            statusText.innerText = "Loading OCR Engine...";
            worker = await Tesseract.createWorker('eng');
            statusText.innerText = "Ready! Click 'Start Camera'.";
        }
        initOCR();

        // 2. Camera Access
        async function startCamera() {
            if (!worker) {
                alert("OCR engine is still loading. Please wait a moment.");
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                });
                handleStream(stream);
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    handleStream(fallbackStream);
                } catch (e) {
                    statusText.innerText = "Camera access denied or unavailable.";
                    statusText.style.color = "#ff3333";
                }
            }
        }

     function parseText(text) {
            // 1. Extract Receipt Number (# followed by numbers)
            const receiptMatch = text.match(/#\s*(\d{5,12})/) || text.match(/(?:OR|INV|NO|RC PT)\s*[:#.]?\s*(\d{5,12})/i);

            if (receiptMatch) {
                const receiptNo = receiptMatch[0];

                // Prevent duplicate processing
                if (scannedReceipts.has(receiptNo)) {
                    statusText.innerText = `Skipped Duplicate: ${receiptNo}`;
                    statusText.style.color = "#ffcc00";
                    return;
                }

                // 2. Flexible Customer Name Extraction
                // Pattern A: Look for explicit labels like "NAME:", "CUSTOMER:", "SOLD TO:"
                let nameMatch = text.match(/(?:NAME|CUSTOMER|SOLD TO|CLIENT)\s*[:.-]?\s*([A-Za-z\s]{3,25})/i);
                
                // Pattern B: Look for uppercase lines if explicit labels aren't printed
                if (!nameMatch) {
                    nameMatch = text.match(/([A-Z\s]{4,20})\s+\d+\.\d{2}/);
                }

                const customerName = nameMatch ? nameMatch[1].trim() : "UNKNOWN";

                // 3. Flexible Amount Extraction
                // Pattern A: Look for keywords like "TOTAL", "AMOUNT", "SUB-TOTAL", "DUE", "PHP", or "₱"
                let totalMatch = text.match(/(?:TOTAL|AMOUNT|SUB-TOTAL|DUE|NET|PHP|₱)\s*[:=]?\s*([\d,]+\.\d{2})/i);
                
                // Pattern B: If no keyword, grab the bottom-most decimal amount on the receipt
                if (!totalMatch) {
                    const allAmounts = text.match(/[\d,]+\.\d{2}/g);
                    if (allAmounts && allAmounts.length > 0) {
                        totalMatch = [null, allAmounts[allAmounts.length - 1]];
                    }
                }

                let amount = 0.00;
                if (totalMatch) {
                    amount = parseFloat(totalMatch[1].replace(',', ''));
                }

                // Mark receipt as processed
                scannedReceipts.add(receiptNo);

                // Cumulative Balance Tracking
                customerBalances[customerName] = (customerBalances[customerName] || 0) + amount;

                // Add Row to Screen
                logData(receiptNo, customerName, amount);

                statusText.innerText = `Scanned ${receiptNo}! Total for ${customerName}: ₱${customerBalances[customerName].toFixed(2)}`;
                statusText.style.color = "#00ff00";
            }
        }

        // 4. Extract Receipt #, Name, and Amount
        function parseText(text) {
            // Match Receipt # (#0000110968)
            const receiptMatch = text.match(/#(\d{6,12})/);

            if (receiptMatch) {
                const receiptNo = receiptMatch[0];

                // Prevent duplicate processing
                if (scannedReceipts.has(receiptNo)) {
                    statusText.innerText = `Skipped Duplicate: ${receiptNo}`;
                    statusText.style.color = "#ffcc00";
                    return;
                }

                // Match Customer Name (e.g., TRESMARIAS)
                const nameMatch = text.match(/\d+\s+[A-Z0-9]+\s+([A-Z\s]{3,20})\s+\d+\.\d{2}/);
                const customerName = nameMatch ? nameMatch[1].trim() : "UNKNOWN";

                // Match Total Amount
                const totalMatch = text.match(/(?:SUB-TOTAL|TOTAL)\s+([\d,]+\.\d{2})/i);
                let amount = 0.00;
                if (totalMatch) {
                    amount = parseFloat(totalMatch[1].replace(',', ''));
                }

                // Mark receipt as processed
                scannedReceipts.add(receiptNo);

                // Cumulative Balance Tracking
                customerBalances[customerName] = (customerBalances[customerName] || 0) + amount;

                // Add Row to Screen
                logData(receiptNo, customerName, amount);

                statusText.innerText = `Scanned ${receiptNo}! Total for ${customerName}: ₱${customerBalances[customerName].toFixed(2)}`;
                statusText.style.color = "#00ff00";
            }
        }

        function logData(receiptNo, name, amount) {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${receiptNo}</td><td>${name}</td><td>₱${amount.toFixed(2)}</td>`;
            logBody.prepend(row);
        }
    </script>
</body>
</html>
