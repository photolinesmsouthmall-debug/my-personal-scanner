<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Receipt Scanner</title>
    <!-- Load Tesseract.js directly from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
        #video-container { position: relative; display: inline-block; width: 100%; max-width: 400px; margin-top: 10px; }
        video { width: 100%; border-radius: 12px; border: 3px solid #333; background: #000; }
        #overlay { position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 2px dashed #00ffcc; pointer-events: none; }
        #status { font-size: 18px; font-weight: bold; margin-top: 15px; color: #00ffcc; }
        .btn { padding: 12px 24px; font-size: 16px; background-color: #00ffcc; color: #121212; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #log-table { width: 100%; max-width: 500px; margin: 20px auto; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        #log-table th, #log-table td { padding: 10px; border-bottom: 1px solid #333; text-align: left; font-size: 14px; }
        #log-table th { background: #2a2a2a; color: #00ffcc; }
    </style>
</head>
<body>

    <h2>Offline Receipt Scanner</h2>
    <p>Runs entirely in your browser with zero server delay.</p>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="overlay"></div>
    </div>

    <br>
    <button id="cam-btn" class="btn" onclick="startCamera()">Start Camera</button>

    <div id="status">Click "Start Camera" to begin.</div>

    <!-- Scanned Receipts Output -->
    <table id="log-table">
        <thead>
            <tr>
                <th>Receipt #</th>
                <th>Customer</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="log-body">
            <!-- Scanned records populate here -->
        </tbody>
    </table>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const camBtn = document.getElementById('cam-btn');
        const logBody = document.getElementById('log-body');

        let isProcessing = false;
        let worker = null;
        let scannedReceipts = new Set();
        let customerBalances = {};

        async function initOCR() {
            statusText.innerText = "Loading OCR Engine...";
            worker = await Tesseract.createWorker('eng');
            statusText.innerText = "Ready! Click 'Start Camera'.";
        }
        initOCR();

        async function startCamera() {
            if (!worker) {
                alert("OCR engine is still loading. Please wait a moment.");
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                });
                handleStream(stream);
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    handleStream(fallbackStream);
                } catch (e) {
                    statusText.innerText = "Camera access denied or unavailable.";
                    statusText.style.color = "#ff3333";
                }
            }
        }

        function handleStream(stream) {
            video.srcObject = stream;
            camBtn.style.display = "none";
            statusText.innerText = "Scanning... Point at receipt";
            statusText.style.color = "#00ffcc";
            setInterval(scanFrame, 1000);
        }

        async function scanFrame() {
            if (isProcessing || !video.videoWidth) return;
            isProcessing = true;

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const { data: { text } } = await worker.recognize(canvas);

            parseText(text);
            isProcessing = false;
        }

        function parseText(text) {
            // 1. RECEIPT #: Fixes truncation by searching for 10-digit number streams starting with 000
            // Catches both #0000111022 and plain 0000111022
            let receiptNo = null;
            const fullReceiptMatch = text.match(/#?\s*(000\d{7})/);
            
            if (fullReceiptMatch) {
                receiptNo = "#" + fullReceiptMatch[1];
            } else {
                const altMatch = text.match(/#\s*(\d{6,10})/);
                if (altMatch) receiptNo = altMatch[0];
            }

            if (receiptNo) {
                if (scannedReceipts.has(receiptNo)) {
                    statusText.innerText = `Skipped Duplicate: ${receiptNo}`;
                    statusText.style.color = "#ffcc00";
                    return;
                }

                // 2. CUSTOMER NAME: Matches text after SN# / SNH / SN code (e.g. SN#:B08903 - CARLOS or SN#:B08901 TRESMARIAS)
                let customerName = "UNKNOWN";

                // Strategy A: Target line containing "SN" and extract trailing name
                const lines = text.split('\n');
                for (let line of lines) {
                    if (/SN/i.test(line)) {
                        // Strip out SN labels, colons, numbers, codes, and trailing dashes
                        let namePart = line.replace(/.*SN[#H:]?\s*[A-Z0-9]{5,8}\s*[-:\s]*/i, '').trim();
                        // Clean non-alphabetical noise
                        namePart = namePart.replace(/[^A-Za-z\s]/g, '').trim();
                        
                        if (namePart.length >= 3 && !/TOTAL|SUB|CASH|PRICE|AMOUNT/i.test(namePart)) {
                            customerName = namePart;
                            break;
                        }
                    }
                }

                // Strategy B: Fallback regex if line splitting fails
                if (customerName === "UNKNOWN") {
                    const fallbackMatch = text.match(/(?:SN[#H]?|S\/N)\s*[:.-]?\s*[A-Z0-9]+\s*[-:\s]+\s*([A-Za-z\s]{3,20})/i);
                    if (fallbackMatch && fallbackMatch[1]) {
                        customerName = fallbackMatch[1].replace(/[^A-Za-z\s]/g, '').trim();
                    }
                }

                // 3. AMOUNT: Locks strictly onto SUB-TOTAL
                let amount = 0.00;
                const subTotalMatch = text.match(/SUB-?\s*TOTAL\s*[:=]?\s*([\d,]+\.\d{2})/i);

                if (subTotalMatch && subTotalMatch[1]) {
                    amount = parseFloat(subTotalMatch[1].replace(',', ''));
                } else {
                    // Fallback to rightmost amount on the SUB-TOTAL line
                    for (let line of lines) {
                        if (/SUB-?\s*TOTAL/i.test(line)) {
                            const lineAmounts = line.match(/[\d,]+\.\d{2}/g);
                            if (lineAmounts && lineAmounts.length > 0) {
                                amount = parseFloat(lineAmounts[lineAmounts.length - 1].replace(',', ''));
                                break;
                            }
                        }
                    }
                }

                // If SUB-TOTAL line was missed completely, take the bottom-most total
                if (amount === 0.00) {
                    const allAmounts = text.match(/[\d,]+\.\d{2}/g);
                    if (allAmounts && allAmounts.length > 0) {
                        amount = parseFloat(allAmounts[allAmounts.length - 1].replace(',', ''));
                    }
                }

                // Save scan and log balance
                scannedReceipts.add(receiptNo);
                customerBalances[customerName] = (customerBalances[customerName] || 0) + amount;

                logData(receiptNo, customerName, amount);

                statusText.innerText = `Scanned ${receiptNo}! Total for ${customerName}: ₱${amount.toFixed(2)}`;
                statusText.style.color = "#00ff00";
            }
        }

        function logData(receiptNo, name, amount) {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${receiptNo}</td><td>${name}</td><td>₱${amount.toFixed(2)}</td>`;
            logBody.prepend(row);
        }
    </script>
</body>
</html>
