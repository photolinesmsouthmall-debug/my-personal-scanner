<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Receipt Scanner & Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
        h2 { margin-top: 5px; color: #00ffcc; text-align: center; }
        #video-container { position: relative; display: block; width: 100%; max-width: 450px; margin: 10px auto; }
        video { width: 100%; border-radius: 12px; border: 2px solid #333; background: #000; }
        #overlay { position: absolute; top: 8%; left: 5%; width: 90%; height: 84%; border: 2px dashed #00ffcc; pointer-events: none; border-radius: 8px; }
        #status { font-size: 15px; font-weight: bold; margin: 10px 0; color: #00ffcc; text-align: center; }
        .btn { padding: 12px 20px; font-size: 15px; background-color: #00ffcc; color: #121212; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: block; margin: 10px auto; width: 100%; max-width: 450px; }
        .config-box { background: #1e1e1e; padding: 15px; border-radius: 8px; max-width: 450px; margin: 10px auto; text-align: left; box-sizing: border-box; }
        .config-box label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        .config-box input { width: 100%; padding: 8px; margin: 4px 0 10px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        
        /* Full Card Preview */
        #preview-card { display: none; background: #1e293b; border: 1px solid #00ffcc; border-radius: 10px; padding: 15px; max-width: 450px; margin: 15px auto; text-align: left; box-shadow: 0 4px 15px rgba(0,255,204,0.15); }
        #preview-card h3 { margin: 0 0 10px 0; color: #00ffcc; font-size: 16px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 15px; font-size: 13px; }
        .grid-2 div span { color: #94a3b8; display: block; font-size: 11px; }

        /* Full Table Styling */
        .table-wrapper { overflow-x: auto; max-width: 100%; margin: 20px auto; }
        #log-table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; font-size: 12px; text-align: left; }
        #log-table th, #log-table td { padding: 8px 10px; border-bottom: 1px solid #333; white-space: nowrap; }
        #log-table th { background: #2a2a2a; color: #00ffcc; font-weight: 600; }
    </style>
</head>
<body>

    <h2>Full Receipt Scanner</h2>

    <!-- Config Settings -->
    <div class="config-box">
        <label>GitHub Username:</label>
        <input type="text" id="gh-owner" placeholder="e.g. jondoe">
        
        <label>Repository Name:</label>
        <input type="text" id="gh-repo" placeholder="receipt-scanner">
        
        <label>Personal Access Token (PAT):</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
        
        <button class="btn" style="margin:0; padding:8px;" onclick="saveConfig()">Save GitHub Credentials</button>
    </div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="overlay"></div>
    </div>

    <button id="cam-btn" class="btn" onclick="startCamera()">Start Camera Scanner</button>
    <div id="status">Save GitHub credentials above or click Start.</div>

    <!-- Live Preview Card for Last Scan -->
    <div id="preview-card">
        <h3>Latest Scan Details</h3>
        <div class="grid-2">
            <div><span>Receipt #</span><strong id="p-receipt">-</strong></div>
            <div><span>Date</span><strong id="p-date">-</strong></div>
            <div><span>Cashier</span><strong id="p-cashier">-</strong></div>
            <div><span>Serial # (SN#)</span><strong id="p-sn">-</strong></div>
            <div><span>Customer</span><strong id="p-customer">-</strong></div>
            <div><span>Item / Description</span><strong id="p-item">-</strong></div>
            <div><span>Sub-Total</span><strong id="p-subtotal">-</strong></div>
            <div><span>Cash Paid</span><strong id="p-cash">-</strong></div>
            <div><span>Change</span><strong id="p-change">-</strong></div>
        </div>
    </div>

    <!-- Full Log Table -->
    <div class="table-wrapper">
        <table id="log-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Receipt #</th>
                    <th>Cashier</th>
                    <th>SN#</th>
                    <th>Customer</th>
                    <th>Item</th>
                    <th>Qty @ Price</th>
                    <th>Sub-Total</th>
                    <th>Cash Paid</th>
                    <th>Change</th>
                </tr>
            </thead>
            <tbody id="log-body"></tbody>
        </table>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const camBtn = document.getElementById('cam-btn');
        const logBody = document.getElementById('log-body');
        const previewCard = document.getElementById('preview-card');

        let isProcessing = false;
        let worker = null;
        let scannedReceipts = new Set();
        let scannedDataList = [];

        // Load credentials from LocalStorage
        document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
        document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';

        function saveConfig() {
            localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
            alert('GitHub settings saved locally!');
        }

        async function initOCR() {
            statusText.innerText = "Loading OCR Engine...";
            worker = await Tesseract.createWorker('eng');
            statusText.innerText = "Ready! Click 'Start Camera Scanner'.";
        }
        initOCR();

        async function startCamera() {
            if (!worker) return alert("OCR engine is still loading.");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                handleStream(stream);
            } catch (err) {
                try {
                    const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                    handleStream(fallback);
                } catch (e) {
                    statusText.innerText = "Camera access denied.";
                }
            }
        }

        function handleStream(stream) {
            video.srcObject = stream;
            camBtn.style.display = "none";
            statusText.innerText = "Scanning... Hold steady over receipt";
            setInterval(scanFrame, 1000);
        }

        async function scanFrame() {
            if (isProcessing || !video.videoWidth) return;
            isProcessing = true;

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const { data: { text } } = await worker.recognize(canvas);
            parseText(text);
            isProcessing = false;
        }

        function parseText(text) {
            // 1. Receipt # (Standardized 10-digit #0000XXXXXX)
            let receiptNo = null;
            const matchDigits = text.match(/#?\s*0*(\d{5,7})/);
            if (matchDigits && matchDigits[1]) {
                receiptNo = "#" + matchDigits[1].padStart(10, '0');
            }

            if (receiptNo) {
                if (scannedReceipts.has(receiptNo)) {
                    statusText.innerText = `Skipped Duplicate: ${receiptNo}`;
                    return;
                }

                // 2. Date Detection (MM/DD/YYYY)
                let dateStr = new Date().toLocaleDateString();
                const dateMatch = text.match(/\b(\d{2}[\/\.-]\d{2}[\/\.-]\d{2,4})\b/);
                if (dateMatch) dateStr = dateMatch[1];

                // 3. Cashier Detection
                let cashier = "N/A";
                const cashierMatch = text.match(/CASHIER\s*[:=]?\s*([A-Za-z\.\s]+)/i);
                if (cashierMatch && cashierMatch[1]) {
                    cashier = cashierMatch[1].trim().split('\n')[0];
                }

                // 4. Serial Number (SN#)
                let snNo = "N/A";
                const snMatch = text.match(/SN[#H:]?\s*([A-Z0-9]+)/i);
                if (snMatch && snMatch[1]) {
                    snNo = snMatch[1].trim();
                }

                // 5. Customer Name (Text after SN#)
                let customerName = "UNKNOWN";
                let cleanedText = text.replace(/S[NH1lI][#H:]?/gi, 'SN#:');
                const custMatch = cleanedText.match(/SN#:\s*[A-Z0-9]*\s*[-:\s]+\s*([A-Za-z\s]{3,20})/i);
                if (custMatch && custMatch[1]) {
                    let extracted = custMatch[1].replace(/[^A-Za-z\s]/g, '').trim();
                    if (!/TOTAL|SUB|CASH|PRICE|AMOUNT|CHANGE|VAT/i.test(extracted) && extracted.length >= 3) {
                        customerName = extracted;
                    }
                }

                // 6. Item Description & Qty @ Price
                let itemDesc = "General Merchandise";
                let qtyPrice = "1 @ 0.00";
                const itemMatch = text.match(/(\d+)\s+([A-Z0-9X]+)\s+([\d\.]+)\s+([\d\.]+)/i);
                if (itemMatch) {
                    qtyPrice = `${itemMatch[1]} pcs @ ₱${itemMatch[3]}`;
                    itemDesc = itemMatch[2];
                }

                // 7. Sub-Total / VAT Sales
                let subtotal = "0.00";
                const subMatch = text.match(/(?:SUB-?TOTAL|VAT\s*SALES)\s*[:=]?\s*([\d,]+\.\d{2})/i);
                if (subMatch && subMatch[1]) {
                    subtotal = subMatch[1];
                } else {
                    const allDecimals = text.match(/\b\d+\.\d{2}\b/g);
                    if (allDecimals && allDecimals.length > 0) subtotal = allDecimals[0];
                }

                // 8. Cash Paid
                let cashPaid = "0.00";
                const cashMatch = text.match(/CASH\s*[:=]?\s*([\d,]+\.\d{2})/i);
                if (cashMatch && cashMatch[1]) cashPaid = cashMatch[1];

                // 9. Change
                let changeVal = "0.00";
                const changeMatch = text.match(/CHANGE\s*[:=]?\s*([\d,]+\.\d{2})/i);
                if (changeMatch && changeMatch[1]) changeVal = changeMatch[1];

                scannedReceipts.add(receiptNo);

                const record = {
                    date: dateStr,
                    receiptNo: receiptNo,
                    cashier: cashier,
                    snNo: snNo,
                    customerName: customerName,
                    itemDesc: itemDesc,
                    qtyPrice: qtyPrice,
                    subtotal: subtotal,
                    cashPaid: cashPaid,
                    changeVal: changeVal
                };

                scannedDataList.push(record);

                // Update UI Card
                document.getElementById('p-receipt').innerText = record.receiptNo;
                document.getElementById('p-date').innerText = record.date;
                document.getElementById('p-cashier').innerText = record.cashier;
                document.getElementById('p-sn').innerText = record.snNo;
                document.getElementById('p-customer').innerText = record.customerName;
                document.getElementById('p-item').innerText = `${record.itemDesc} (${record.qtyPrice})`;
                document.getElementById('p-subtotal').innerText = "₱" + record.subtotal;
                document.getElementById('p-cash').innerText = "₱" + record.cashPaid;
                document.getElementById('p-change').innerText = "₱" + record.changeVal;
                previewCard.style.display = 'block';

                logData(record);

                statusText.innerText = `Scanned ${receiptNo}! Saving full dataset...`;
                statusText.style.color = "#00ffcc";

                saveToGitHubCSV(scannedDataList);
            }
        }

        function logData(r) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${r.date}</td>
                <td><strong>${r.receiptNo}</strong></td>
                <td>${r.cashier}</td>
                <td>${r.snNo}</td>
                <td>${r.customerName}</td>
                <td>${r.itemDesc}</td>
                <td>${r.qtyPrice}</td>
                <td>₱${r.subtotal}</td>
                <td>₱${r.cashPaid}</td>
                <td>₱${r.changeVal}</td>
            `;
            logBody.prepend(row);
        }

        // --- GITHUB FULL CSV EXPORT ---
        async function saveToGitHubCSV(dataList) {
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!owner || !repo || !token) {
                statusText.innerText = "Scanned locally. Fill GitHub info to sync CSV!";
                statusText.style.color = "#ffcc00";
                return;
            }

            let csvContent = "Date,Receipt No,Cashier,SN#,Customer Name,Item Description,Qty @ Price,Sub-Total,Cash Paid,Change\n";
            dataList.forEach(r => {
                csvContent += `"${r.date}","${r.receiptNo}","${r.cashier}","${r.snNo}","${r.customerName}","${r.itemDesc}","${r.qtyPrice}","${r.subtotal}","${r.cashPaid}","${r.changeVal}"\n`;
            });

            const path = 'scanned_receipts.csv';
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const encodedContent = btoa(unescape(encodeURIComponent(csvContent)));

            try {
                let sha = null;
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update full scanned receipts dataset [${new Date().toLocaleTimeString()}]`,
                        content: encodedContent,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    statusText.innerText = `Saved ${dataList[dataList.length - 1].receiptNo} with full details to GitHub!`;
                    statusText.style.color = "#00ff00";
                } else {
                    statusText.innerText = "GitHub save failed. Check token repo access.";
                    statusText.style.color = "#ff3333";
                }
            } catch (err) {
                console.error("GitHub CSV sync failed:", err);
                statusText.innerText = "Network error while saving to GitHub.";
            }
        }
    </script>
</body>
</html>
